networks:
  traefik:
    external: true

services:
  quiz-game:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quiz-game
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/quizgame.db
    volumes:
      - ./data:/app/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.quiz-game.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.quiz-game.entrypoints=websecure"
      - "traefik.http.routers.quiz-game.tls=true"
      - "traefik.http.routers.quiz-game.tls.certresolver=lets-encrypt"
      - "traefik.http.services.quiz-game.loadbalancer.server.port=8080"
